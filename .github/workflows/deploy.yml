name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Quyền tối thiểu để đăng lên GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Không chạy song song nhiều lần deploy; vẫn để lần đang chạy hoàn tất.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node LTS + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Cài phụ thuộc (đúng lockfile)
        run: npm ci

      - name: Kiểm tra ESLint
        run: npm run lint

      - name: Kiểm tra định dạng Prettier
        run: npm run format:check

      - name: Chạy unit test
        run: npm test

      - name: Build cho GitHub Pages
        run: npm run build
        env:
          # Vite sẽ dùng base /<tên-repo>/ để mọi asset tải đúng trên Pages.
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Cấu hình Pages
        uses: actions/configure-pages@v5
        with:
          # Tự bật Pages (nguồn GitHub Actions) nếu repo chưa bật.
          enablement: true

      - name: Đóng gói thư mục dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
